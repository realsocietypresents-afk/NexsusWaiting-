# NexusWaiting: a list of things that finish in real time, shown at login and pinged to Discord.

login:
  # when-ready = the list pops up at login only if something is ready (recommended)
  # always     = pops up at every login
  # never      = never by itself (players type /waiting)
  popup: when-ready
  # Seconds after joining before the list opens (NexusWelcome opens its menu at 5, so keep this above that).
  delay-seconds: 8
  # Wait until the player is really in (NexusGate login done) and has no other menu open.
  wait-for-login: true
  timeout-seconds: 180

# How often (seconds) finished timers are announced. Changing this needs a server restart.
check-interval-seconds: 30
# Tell an online player in chat when something finishes.
notify-online: true
# Finished timers nobody collected are dropped after this many days (scouts are never dropped).
cleanup-days: 30
max-timers-per-player: 40

menu:
  title: "&d&lWaiting for you"
  filler: true
  filler-icon: GRAY_STAINED_GLASS_PANE

discord:
  # Pings a player on Discord when something finishes while they are offline.
  # 1. In Discord: channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
  # 2. Paste it below and set enabled to true, then /waiting reload.
  # Keep the URL secret (anyone who has it can post to your channel). It is never printed in the log.
  enabled: false
  webhook-url: ""
  # One player is pinged at most once per this many minutes, and at most max-pings-per-day times a day.
  min-minutes-between-pings: 30
  max-pings-per-day: 3
  # Whole-server safety limit.
  max-pings-per-hour-server: 30
  # Things that finished more than this long ago are not worth a ping any more.
  skip-older-than-hours: 24
  username: "RealSociety"
  server-name: "RealSociety"
  # {server} and {what} (what is ready) are filled in. Colour codes are removed.
  message: "Something is waiting for you on {server}: {what}"

errands:
  # Players send a scout to a place; it comes back after real time with a haul and a short story.
  enabled: true
  # Scouts out at once. A player gets more with the permissions nexuswaiting.slots.2, .3, .4 (max 4).
  slots: 1
  max-slots: 4
  # Up to 7 places. Each find: item + min/max amount (1-64) + weight (higher = more common),
  # or a command run as the console ({player} is filled in), for example to pay money:
  #   pay:
  #     command: "eco give {player} 100"
  #     weight: 2
  destinations:
    woods:
      name: "&aThe Woods"
      icon: OAK_SAPLING
      minutes: 15
      lore:
        - "A quick walk under the trees."
      rolls: 2
      rewards:
        logs:
          item: OAK_LOG
          min: 4
          max: 12
          weight: 10
        sticks:
          item: STICK
          min: 4
          max: 10
          weight: 6
        apples:
          item: APPLE
          min: 1
          max: 3
          weight: 4
        berries:
          item: SWEET_BERRIES
          min: 3
          max: 8
          weight: 5
      jackpot:
        chance-percent: 3
        rewards:
          tag:
            item: NAME_TAG
            min: 1
            max: 1
            weight: 1
          golden:
            item: GOLDEN_APPLE
            min: 1
            max: 1
            weight: 1
      stories:
        - "Your scout followed a fox for an hour and found where it hides its snacks."
        - "A friendly woodcutter swapped a story for a handful of sticks."
        - "Your scout got lost, then found itself again. Mostly."
    mine:
      name: "&7The Old Mine"
      icon: IRON_PICKAXE
      minutes: 60
      lore:
        - "Dark tunnels, a lantern, and a lot of echoes."
      rolls: 3
      rewards:
        coal:
          item: COAL
          min: 6
          max: 16
          weight: 10
        copper:
          item: RAW_COPPER
          min: 4
          max: 10
          weight: 7
        iron:
          item: IRON_INGOT
          min: 3
          max: 8
          weight: 6
        lapis:
          item: LAPIS_LAZULI
          min: 3
          max: 9
          weight: 4
        redstone:
          item: REDSTONE
          min: 4
          max: 12
          weight: 4
        gold:
          item: GOLD_INGOT
          min: 2
          max: 5
          weight: 2
      jackpot:
        chance-percent: 4
        rewards:
          diamond:
            item: DIAMOND
            min: 1
            max: 2
            weight: 1
      stories:
        - "Your scout swears something knocked back from inside the wall."
        - "The lantern flickered twice. Your scout decided that was enough for one trip."
        - "An old minecart track led somewhere interesting, and your scout wrote it all down."
    marsh:
      name: "&2The Marsh"
      icon: LILY_PAD
      minutes: 240
      lore:
        - "Slow, damp, and full of odd finds."
      rolls: 3
      rewards:
        mushrooms:
          item: BROWN_MUSHROOM
          min: 3
          max: 8
          weight: 8
        string:
          item: STRING
          min: 4
          max: 10
          weight: 8
        eyes:
          item: SPIDER_EYE
          min: 2
          max: 5
          weight: 5
        bones:
          item: BONE
          min: 4
          max: 10
          weight: 7
      jackpot:
        chance-percent: 5
        rewards:
          pearl:
            item: ENDER_PEARL
            min: 1
            max: 2
            weight: 1
      stories:
        - "Your scout came back muddy to the knees and weirdly proud."
        - "Lights over the water followed your scout all the way home."
        - "A very old frog gave your scout directions. They were wrong."
    ruins:
      name: "&6The Lost Ruins"
      icon: BRICKS
